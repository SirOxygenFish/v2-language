# Build and test V2 on every platform (INTERNALS 22.5). The engine columns of the matrix
# (Python, Node, C/C++ compilers, V2_TEST_REQUIRE) are added as roadmap Phases 1 and 2 land.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
