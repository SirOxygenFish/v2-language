# Build and test V2 on Windows and Linux (INTERNALS 22.5). macOS is tested on the owner's Mac (the
# owner's choice, 2026-11-10). The C/C++ and @rust columns are added when roadmap Phase 2 lands.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-latest, os: windows-latest, python: '3.13', node: '22' }
          - { name: ubuntu-latest, os: ubuntu-latest, python: '3.13', node: '22' }
          - { name: minimum versions, os: ubuntu-22.04, python: '3.10', node: '22.13.0' }
    env:
      V2_TEST_REQUIRE: py,js,ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
