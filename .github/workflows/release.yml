# Build the prebuilt binaries (INTERNALS 22.6) and put them on a DRAFT GitHub release; a person
# publishes it. Three ways to run it: Actions > Release > Run workflow (once this file is on the
# default branch), pushing a `v*` tag, or, before that, a push to v2-reboot whose commit message
# contains [release]. The tag must be `v` + Cargo.toml's version, and install.sh and install.ps1
# must name it. A draft creates no tag: publishing it does, at the commit it targets.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag, e.g. v0.1.0-alpha.2 (created only when the draft is published)"
        required: true
  push:
    tags: ["v*"]
    branches: [v2-reboot]

permissions:
  contents: write

jobs:
  version:
    # A branch push builds only when asked to, with [release] in its commit message.
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        name: The tag, and the version names that must match it
        env:
          WANTED: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          tag="${WANTED:-v$crate}"
          [ "$tag" = "v$crate" ] || { echo "the tag $tag is not v$crate (Cargo.toml)"; exit 1; }
          grep -q "V2_VERSION:-$tag}" install.sh || { echo "install.sh doesn't install $tag"; exit 1; }
          grep -q "else { '$tag' }" install.ps1 || { echo "install.ps1 doesn't install $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: the C runtime linked in, so a fresh Windows needs no Visual C++ package.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, rustflags: "-C target-feature=+crt-static" }
          # Linux: built on the oldest runner, so the binary needs only glibc 2.35.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, rustflags: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, rustflags: "" }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir stage
          cp LICENSE README.md stage/
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/v2.exe stage/
            asset="v2-${{ matrix.target }}.zip"
            (cd stage && 7z a -tzip "../$asset" . >/dev/null)
          else
            cp target/release/v2 stage/
            asset="v2-${{ matrix.target }}.tar.gz"
            tar -czf "$asset" -C stage v2 LICENSE README.md
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
          echo "ASSET=$asset" >> "$GITHUB_ENV"
      # The install check follows README.md's quickstart with the packaged binary on a fresh runner.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install and follow the README (Linux, macOS)
        if: runner.os != 'Windows'
        run: sh tests/install/smoke.sh "$ASSET"
      - name: Install and follow the README (Windows PowerShell)
        if: runner.os == 'Windows'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\install\smoke.ps1 $env:ASSET
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  draft:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          notes="V2 ${TAG#v}, an alpha. Install it with the one-line command for your system in README.md, or download the file for your computer below. Python blocks need Python 3.10+, JavaScript and TypeScript blocks Node.js 22.13+. What isn't built yet: README.md, \"Known limitations\"."
          if gh release view "$TAG" >/dev/null 2>&1; then
            [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ] || { echo "$TAG is already published: not touching it"; exit 1; }
            gh release edit "$TAG" --target "$GITHUB_SHA"
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --draft --prerelease --target "$GITHUB_SHA" --title "V2 ${TAG#v}" --notes "$notes"
          fi
