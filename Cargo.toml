[package]
name = "v2"
version = "0.1.0-alpha.1"
edition = "2021"
description = "V2: a small glue language built around embedded Python, JS/TS, C, C++ and Rust"
license = "MIT"
publish = false

[[bin]]
name = "v2"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
toml = { version = "1.1", features = ["preserve_order"] }
indexmap = "2.14"
libloading = "0.9"
libffi = "5.2"
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
